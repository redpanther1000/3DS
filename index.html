<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3DS Diagnostic Player</title><script src="coi-serviceworker.js"></script><style>body{margin:0;background:#10141d;color:#e6eefc;font:15px system-ui}header{padding:16px;background:#1b2230}button,input{margin:6px;padding:9px}#game{height:70vh}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;background:#192130}small{color:#b6c5da}</style><header><strong>Game Station 3DS — diagnostic build 4</strong><br><input id="file" type="file" accept=".cci,.3ds,.cxi"><button id="start">Start nightly</button><button onclick="location.reload()">Reset</button><button id="copy">Copy log</button><br><small>Extract archives first. Loads third-party EmulatorJS/Azahar from its CDN. This is an untested diagnostic frontend, not a new emulator. No ROM upload endpoint is included.</small></header><div id="game"></div><pre id="log"></pre><script>
const logBox=document.getElementById('log');const log=x=>{logBox.textContent+=new Date().toLocaleTimeString()+' '+x+'\n'};
window.addEventListener('error',e=>{let t=e.target;log(e.message?('ERROR '+e.message+' '+e.filename+':'+e.lineno):('RESOURCE ERROR '+(t.src||t.href||t.tagName)))},true);
window.addEventListener('unhandledrejection',e=>log('REJECTION '+String(e.reason?.stack||e.reason)));
const nativeFetch=window.fetch.bind(window);window.fetch=async(...args)=>{let u=String(args[0]?.url||args[0]);log('FETCH '+u);try{let r=await nativeFetch(...args);log('HTTP '+r.status+' '+u);return r}catch(e){log('FETCH FAILED '+u+' '+e.message);throw e}};
const open=XMLHttpRequest.prototype.open,send=XMLHttpRequest.prototype.send;
XMLHttpRequest.prototype.open=function(m,u,...rest){this._url=String(u);return open.call(this,m,u,...rest)};
XMLHttpRequest.prototype.send=function(...a){log('XHR '+this._url);this.addEventListener('loadend',()=>log('XHR END status='+this.status+' '+this._url));this.addEventListener('error',()=>log('XHR ERROR '+this._url));return send.apply(this,a)};
for(const level of ['error','warn']){const old=console[level].bind(console);console[level]=(...a)=>{log(level.toUpperCase()+' '+a.map(x=>String(x?.stack||x)).join(' '));old(...a)}}
log('Build 4; isolated='+crossOriginIsolated+'; threads='+navigator.hardwareConcurrency);
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(logBox.textContent)}catch(e){log('Copy unavailable: select the log text manually.')}};
document.getElementById('start').onclick=async()=>{let f=document.getElementById('file').files[0];if(!f){log('Choose a decrypted .cci, .3ds or .cxi first.');return}if(!crossOriginIsolated){log('STOP: isolation is off. Reload normally using Command+R on the GitHub site.');return}document.getElementById('start').disabled=true;log('FILE '+f.name+' bytes='+f.size);if(f.size>=2147483648)log('Large file: memory allocation may fail. This is not a confirmed diagnosis.');window.EJS_player='#game';window.EJS_core='3ds';window.EJS_gameUrl=URL.createObjectURL(f);window.EJS_gameName=f.name;window.EJS_pathtodata='https://cdn.emulatorjs.org/nightly/data/';window.EJS_threads=true;window.EJS_startOnLoaded=true;window.EJS_askBeforeExit=true;window.EJS_onGameStart=()=>log('START CALLBACK (does not prove frames are rendered)');window.EJS_ready=()=>log('EMULATOR READY');let s=document.createElement('script');s.src=EJS_pathtodata+'loader.js';s.crossOrigin='anonymous';s.onload=()=>log('Loader script executed');s.onerror=()=>log('Loader script failed');document.body.appendChild(s);setTimeout(()=>log('30-second checkpoint: copy this log if the screen is black.'),30000)};
</script></html>
